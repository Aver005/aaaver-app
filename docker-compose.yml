services:
  # `depends_on: postgres` здесь НЕТ, и это не забывчивость. Postgres описан
  # в родительском /root/compose.yml, а этот файл подключается к нему через
  # include — ссылка на чужой сервис ломает compose («depends on undefined
  # service»). Взамен сервер устроен так, чтобы подниматься при лежащей базе:
  # статика отдаётся всегда, всё, что ходит в базу, отвечает 503 и лечится
  # само, когда Postgres возвращается (см. server/db/client.ts).
  app:
    build: .
    container_name: aaaver-app
    restart: unless-stopped
    ports:
      - '6110:3000'
    env_file: .env
    environment:
      # внутри контейнера всегда так, что бы ни лежало в .env
      PORT: 3000
      SITES_DIR: /sites
      SITES_UPDATER_URL: http://sites-updater:8484
    volumes:
      # демки: ./sites/<slug>/ на хосте = https://.../<slug>/, без пересборки
      - ./sites:/sites:ro
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "const r = await fetch('http://localhost:3000/api/health'); process.exit(r.ok ? 0 : 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Автодеплой демок: читает реестр из базы (таблица `sites`, её пишет
  # панель), опрашивает релизы и обновляет sites/. Единственный, у кого этот
  # каталог смонтирован на запись, — основной сервер видит его read-only.
  #
  # `depends_on` нет по той же причине, что и у app: Postgres описан в
  # родительском compose. Недоступный реестр — пропущенный цикл, не падение.
  sites-updater:
    build: .
    container_name: aaaver-sites-updater
    restart: unless-stopped
    command: ['bun', 'scripts/sites-updater.ts']
    env_file: .env
    environment:
      SITES_DIR: /sites
    volumes:
      - ./sites:/sites
